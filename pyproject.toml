[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jmag-script-skill"
version = "0.3.0"
description = "Token-efficient JMAG Script capability platform"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jmag-skill = "jmag_skill.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
